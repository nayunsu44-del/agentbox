[project]
name = "agentbox"
version = "0.1.0"
description = "망 안의 에이전트 컴퓨터 — AI 에이전트용 격리 샌드박스, 사람 승인, 해시 체인 감사 로그"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",          # 화면 보기 웹소켓 (uvicorn이 쓴다)
  "jinja2>=3.1",             # 웹 UI 템플릿
  "python-multipart>=0.0.9", # 파일 끌어다 놓기 (multipart 업로드)
  "docker>=7.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "mcp>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
agentbox = "agentbox.cli:main"
agentbox-mcp = "agentbox.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentbox"]

[tool.setuptools.package-data]
agentbox = ["default_policy.yaml", "templates/*.html", "static/*"]
