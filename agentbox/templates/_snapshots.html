{% if snaps %}
<table>{% for s in snaps %}
  <tr><td class="mono">{{ s.id }}</td><td class="mut">{{ s.created_at[11:19] }}</td><td class="mut">{{ s.reason | short(40) }}</td>
      <td><button hx-post="/ui/sandboxes/{{ sid }}/restore/{{ s.id }}" hx-target="#snaps" hx-confirm="{{ s.id }} 시점으로 되돌릴까요? 그 뒤의 변경은 사라진다.">복원</button></td></tr>
{% endfor %}</table>
{% else %}<p class="mut">없음</p>{% endif %}
