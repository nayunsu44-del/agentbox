{% extends "base.html" %}
{% block main %}
<div class="grid">
<div>
  <section>
    <h2>새 샌드박스</h2>
    <form hx-post="/ui/sandboxes" hx-target="#created" hx-disabled-elt="find button">
      <label>템플릿
        <select name="template">{% for t in templates %}<option value="{{ t }}" {{ "selected" if t == "desktop" }}>{{ t }}{{ " (리눅스 데스크톱, 화면·GUI 도구)" if t == "desktop" else " (명령줄만)" }}</option>{% endfor %}</select>
      </label>
      <label style="margin-left:10px">원본 폴더 <input name="source_dir" placeholder="비우면 빈 폴더 (파일은 다음 화면에서 끌어다 놓기)" size="44"></label>
      <button class="primary">만들기</button>
    </form>
    <p class="mut">네트워크 차단, 원본 읽기 전용, 비root 계정, CPU·메모리·프로세스 상한이 걸린 채로 만들어진다.</p>
    <div id="created"></div>
  </section>
  <section>
    <h2>샌드박스</h2>
    <div hx-get="/ui/sandboxes" hx-trigger="load, every 5s, sandboxes-changed from:body"></div>
  </section>
</div>
<div>
  <section>
    <h2>승인 대기 (전체)</h2>
    <div id="approvals" hx-get="/ui/approvals" hx-trigger="load, every 2s"></div>
  </section>
</div>
</div>
{% endblock %}
