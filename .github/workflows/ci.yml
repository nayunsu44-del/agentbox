name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docker 없이 도는 단위 테스트. 지원하는 가장 낮은 버전과 최신 버전에서 돌린다.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      - run: python -m pytest -q tests/test_unit.py tests/test_m2_unit.py tests/test_m4_unit.py tests/test_instruction_files.py

  # 실제 Docker 위의 전체 테스트 (수용 테스트, 데스크톱 포함).
  # 수용 테스트는 Docker나 데스크톱 이미지가 없으면 건너뛰므로, 하나라도 건너뛰면 실패로 본다.
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[test]'
      - run: docker pull buildpack-deps:noble-curl
      - uses: docker/setup-buildx-action@v3
      - name: 데스크톱 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: images/desktop
          tags: agentbox-desktop:0.1
          load: true
          cache-from: type=gha,scope=agentbox-desktop
          cache-to: type=gha,scope=agentbox-desktop,mode=max
      - name: 전체 테스트
        run: python -m pytest -q -rs --junitxml=pytest-report.xml
      - name: 건너뛴 테스트가 없는지 확인
        if: always()
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          skipped = [f"{c.get('classname')}::{c.get('name')}" for c in root.iter("testcase") if c.find("skipped") is not None]
          print(f"건너뛴 테스트 {len(skipped)}개")
          for name in skipped:
              print("  " + name)
          sys.exit(1 if skipped else 0)
          EOF
      - name: 남은 샌드박스 컨테이너·스냅샷 이미지
        if: always()
        run: |
          docker ps -a --filter label=agentbox
          docker images agentbox-snap
